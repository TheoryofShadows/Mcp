# Nixpacks config for Railway
# https://nixpacks.com/docs/configuration/file
#
# Railway sets NODE_ENV=production, which makes the default install omit
# devDependencies. vite lives in devDependencies, so builds fail with
# "vite: not found". Force a full install (including vite) at install time.
# Prefer `npm install` over `npm ci` so adding a dependency in package.json
# (e.g. @aws-sdk/client-s3) still builds if the lockfile lags slightly.
# Do NOT re-run install in the build phase — Railway mounts a cache at
# node_modules/.cache and a second install can hit EBUSY.

[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = ["npm install --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
