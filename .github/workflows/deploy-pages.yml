name: Deploy demo to GitHub Pages

# Publishes the marketplace SPA to GitHub Pages as a browsable demo.
# The demo runs on the app's bundled seed data (no backend on Pages) and links
# out to the live app at https://www.mcpx.digital for real installs/accounts.
#
# One-time setup (repo admin): Settings → Pages → Build and deployment →
# Source = "GitHub Actions". After that, every push to main redeploys here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress production deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build SPA for the /Mcp/ project-page sub-path
        env:
          PAGES_BASE: /Mcp/
        run: npm run build

      - name: Add SPA deep-link fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
