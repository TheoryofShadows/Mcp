name: Feature Request
description: Suggest a new feature or improvement for MCPX
title: "[Feature]: "
labels: ["enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please fill out the sections below so we can evaluate your proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem or limitation you are experiencing. Is this related to a frustration with the current behavior?
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
      placeholder: A clear and concise description of your proposed solution.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you have considered.
      placeholder: A description of any alternative solutions or workarounds.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here.
      placeholder: Any additional information that might help.
    validations:
      required: false
