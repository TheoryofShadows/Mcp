version: 2

registries:
  npm-registry:
    type: npm-registry
    url: https://registry.npmjs.org
    replaces-base: true

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    registries:
      - npm-registry
    groups:
      npm_and_yarn:
        patterns:
          - "*"
        applies-to: security-updates
    open-pull-requests-limit: 10
